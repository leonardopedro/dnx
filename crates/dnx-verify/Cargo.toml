[package]
name = "dnx-verify"
version = "0.1.0"
edition.workspace = true
description = "Compare a Nix expression's DeltaNet with an AustralVM expression's DeltaNet"

[dependencies]
dnx-core = { path = "../dnx-core" }
dnx-lang = { path = "../dnx-lang" }
# The AustralVM DeltaNet implementation (kernel: unfer/logos/src/deltanet).
# Used in-process so both nets are hashed by the *same* canonical serializer.
logos = { path = "../../../unfer/logos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "dnx-verify"
path = "src/main.rs"
